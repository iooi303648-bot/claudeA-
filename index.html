<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찾아가는 A+++ 디지털 직무연수</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0066cc;--text:#1d1d1f;--muted:#86868b;--bg:#f2f2f4;--white:#fff;--card:rgba(245,245,247,0.75);}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Noto Sans KR',-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
#app{display:flex;flex-direction:column;height:100vh;width:100vw;overflow:hidden;}
.bar1{flex-shrink:0;height:40px;background:#111;display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
.bar1-logo{color:#fff;opacity:.8;font-size:17px}
.bar1-links{display:flex;gap:28px}
.bar1-links span{font-size:10px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:color .2s}
.bar1-links span:hover{color:#fff}
.bar2{flex-shrink:0;height:48px;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-bottom:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 28px;}
.bar2 h2{font-size:15px;font-weight:700;letter-spacing:-.02em}
.bar2-btns{display:flex;gap:8px}
.btn-ghost{background:#fff;border:.5px solid rgba(0,0,0,.12);color:var(--text);font-size:11px;font-weight:700;padding:5px 13px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;transition:background .15s;}
.btn-ghost:hover{background:#f0f0f2}
.btn-primary{background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:5px 15px;border-radius:999px;border:none;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(0,102,204,.28);}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 18px 10px 42px;position:relative;overflow:hidden;}
.indicator{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:10;}
.ind-dot{width:3px;height:3px;border-radius:2px;background:rgba(0,0,0,.13);cursor:pointer;transition:all .4s;}
.ind-dot.on{height:22px;background:var(--blue)}
.canvas{height:calc(100vh - 116px);width:calc((100vh - 116px) * 16 / 9);max-width:100%;background:var(--white);border-radius:36px;box-shadow:0 28px 90px -14px rgba(0,0,0,.13);border:.5px solid rgba(0,0,0,.03);overflow:hidden;position:relative;}
.slide{position:absolute;inset:0;padding:5% 6%;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .45s ease,transform .45s ease,filter .45s ease;transform:scale(.985);filter:blur(4px);overflow:hidden;}
.slide.active{opacity:1;pointer-events:auto;transform:scale(1);filter:blur(0)}
.slide-grid{display:grid!important}
.slide-section{display:block!important}
.slide-section .sec-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:1;padding:5% 6%;}
.nav-ctrl{position:absolute;bottom:2.5%;right:2.5%;display:flex;align-items:center;gap:8px;z-index:20}
.nav-btn{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.06);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .15s,transform .1s;font-family:inherit;}
.nav-btn:hover{background:rgba(0,0,0,.11)}
.nav-btn:active{transform:scale(.9)}
.nav-btn:disabled{opacity:0;pointer-events:none}
.nav-count{font-size:9px;font-weight:700;color:rgba(0,0,0,.2);letter-spacing:.1em}
.footer{flex-shrink:0;height:28px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(0,0,0,.2);}
.tag{font-size:.6em;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:.4em}
.big-h1{font-size:4.6em;font-weight:900;letter-spacing:-.05em;line-height:.93;word-break:keep-all}
.big-h2{font-size:2.6em;font-weight:900;letter-spacing:-.04em;line-height:1.08;word-break:keep-all}
.mid-h2{font-size:1.7em;font-weight:900;letter-spacing:-.04em;line-height:1.15;word-break:keep-all}
.body-t{font-size:.8em;color:var(--muted);font-weight:500;line-height:1.65;word-break:keep-all}
.meta-t{font-size:.72em;color:var(--muted);font-weight:500;line-height:1.9}
.card{background:var(--card);border-radius:20px;border:.5px solid rgba(0,0,0,.04);padding:1.2em 1.3em;transition:background .25s,box-shadow .25s;display:flex;flex-direction:column;overflow:hidden;}
.card:hover{background:var(--white);box-shadow:0 10px 36px rgba(0,0,0,.07)}
.icon-box{width:2.1em;height:2.1em;background:var(--white);border-radius:.6em;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:.65em;color:var(--blue);}
.icon-box svg{width:1.1em;height:1.1em;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dot-bullet{width:.42em;height:.42em;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:.5em}
.chip{display:inline-flex;align-items:center;gap:.4em;background:rgba(0,102,204,.09);color:var(--blue);font-size:.58em;font-weight:700;padding:.45em 1em;border-radius:999px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:.7em;}
.chip svg{width:.9em;height:.9em;stroke:currentColor;stroke-width:2;fill:none}
.link-btn{display:inline-flex;align-items:center;gap:.5em;background:var(--blue);color:#fff;font-size:.75em;font-weight:700;padding:.6em 1.4em;border-radius:999px;text-decoration:none;box-shadow:0 4px 16px rgba(0,102,204,.28);transition:opacity .2s;font-family:inherit;}
.link-btn:hover{opacity:.85}
.link-btn svg{width:.9em;height:.9em;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.link-t{color:var(--blue);font-size:.75em;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:.3em;}
.link-t:hover{text-decoration:underline}
.link-t svg{width:.8em;height:.8em;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.qr-box{background:var(--bg);border-radius:16px;border:.5px solid rgba(0,0,0,.06);padding:.7em;display:inline-flex}
.qr-box img{width:clamp(6em,13em,14em);height:auto;display:block}
.sec-num{position:absolute;right:3%;top:50%;transform:translateY(-50%);font-size:15em;font-weight:900;letter-spacing:-.06em;line-height:1;color:rgba(0,102,204,.04);pointer-events:none;user-select:none;}
.video-wrap{border-radius:18px;overflow:hidden;background:#000;cursor:pointer;box-shadow:0 10px 36px rgba(0,0,0,.2);position:relative;}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-thumb{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;}
.play-btn{width:3.4em;height:3.4em;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:2;transition:transform .25s,background .25s;color:var(--blue);}
.play-btn svg{width:1.2em;height:1.2em;fill:currentColor;stroke:none;margin-left:.15em}
.video-wrap:hover .play-btn{transform:scale(1.1);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4%;flex:1;min-height:0;overflow:hidden}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2%;flex:1;min-height:0;overflow:hidden}
@media print{.bar1,.bar2,.indicator,.nav-ctrl,.footer{display:none!important}.stage{padding:0}.canvas{border-radius:0;box-shadow:none;height:100vh;width:100vw}}
</style>
</head>
<body>
<div id="app">
  <div class="bar1">
    <span class="bar1-logo">◎</span>
    <div class="bar1-links"><span>교육</span><span>혁신</span><span>디지털</span><span>지원</span></div>
    <div style="width:18px"></div>
  </div>
  <div class="bar2">
    <h2>찾아가는 A+++ 디지털 직무연수</h2>
    <div class="bar2-btns">
      <button class="btn-ghost" onclick="window.print()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        PDF 저장
      </button>
      <button class="btn-primary">발표 시작</button>
    </div>
  </div>
  <div class="stage">
    <div class="indicator" id="indicator"></div>
    <div class="canvas" id="canvas">

      <!-- ① 인트로 -->
      <div class="slide active" data-idx="0" style="justify-content:flex-end;padding-bottom:4%">
        <span class="tag">디지털 교육의 미래</span>
        <h1 class="big-h1" style="white-space:pre-line;margin-bottom:5%">찾아가는 A+++
디지털 직무연수</h1>
        <p class="meta-t" style="white-space:pre-line">부산 SW AI 교육운영 지원단
동일중앙초등학교 김형준</p>
      </div>

      <!-- ② 연수 안내 -->
      <div class="slide" data-idx="1" style="align-items:center;justify-content:center;text-align:center;gap:3%">
        <h2 class="big-h2">연수 안내자료</h2>
        <p class="body-t">원활한 연수 진행을 위해 아래 자료를 확인해 주세요.</p>
